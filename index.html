<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Plans</title>
<meta name="description" content="Short Bible reading plans with context. Progress is kept in your own browser — no account, no server, no tracking.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:title" content="Reading Plans">
<meta property="og:description" content="Short Bible reading plans with context. Progress is kept in your own browser — no account, no server, no tracking.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jbuck01.github.io/bible-reading/">
<meta name="twitter:card" content="summary">
<script>
// Apply saved theme before CSS to avoid a flash. The only exception to
// "only storage.js touches localStorage" — kept inline so it runs pre-paint.
try {
  var ui = localStorage.getItem("readingPlans:v1:ui");
  var pref = ui ? (JSON.parse(ui) || {}).theme : null;
  if (pref === "light" || pref === "dark") {
    document.documentElement.setAttribute("data-theme", pref);
  }
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<nav class="toolbar" id="ui-toolbar" aria-label="Site controls"></nav>
<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Reading plans</p>
    <h1>Reading <em>Plans</em></h1>
    <p class="lede">Short plans that put each book in its context. Progress is kept in your browser; nothing leaves this device.</p>
  </header>
  <section class="library" id="library" aria-label="Available plans"></section>
  <p class="save" id="storage-notice" role="status" hidden></p>
</div>
<script src="assets/storage.js"></script>
<script src="plans/index.js"></script>
<script src="assets/library.js"></script>
<script src="assets/theme.js"></script>
</body>
</html>
