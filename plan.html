<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading plan</title>
<meta name="description" content="A Bible reading plan from Reading Plans. Progress is kept in your own browser — no account, no server, no tracking.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:title" content="Reading plan">
<meta property="og:description" content="A Bible reading plan from Reading Plans. Progress is kept in your own browser.">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary">
<script>
// Apply saved theme before CSS to avoid a flash. The only exception to
// "only storage.js touches localStorage" — kept inline so it runs pre-paint.
try {
  var ui = localStorage.getItem("readingPlans:v1:ui");
  var pref = ui ? (JSON.parse(ui) || {}).theme : null;
  if (pref === "light" || pref === "dark") {
    document.documentElement.setAttribute("data-theme", pref);
  }
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wrap" id="root">
  <p class="save" role="status">Loading…</p>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toast-msg"></span><button type="button" data-action="undo">Undo</button></div>
<script src="assets/storage.js"></script>
<script src="assets/schedule.js"></script>
<script src="plans/index.js"></script>
<script src="assets/plan-page.js"></script>
<script src="assets/theme.js"></script>
</body>
</html>
