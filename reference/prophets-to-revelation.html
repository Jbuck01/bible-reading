<title>Prophets to Revelation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column. A glazed-brick timeline (Joel → Revelation) up top, then Plan / Books tabs. */
:root{
  --bg:#ECEFF5; --surface:#F9FAFD; --sunk:#E1E6F0; --ink:#131D3B; --muted:#56607C; --line:#CDD4E3;
  --lapis:#2443A6; --lapis-soft:#D9E1F6; --on-lapis:#FFFFFF;
  --ochre:#A86D08; --ochre-soft:#F2E3C2; --dot-on-done:#F2C35C;
  --f-display:"Alegreya", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1330; --surface:#121C3F; --sunk:#1A2550; --ink:#E6E9F3; --muted:#9BA4C2; --line:#28335E;
    --lapis:#8AA4FF; --lapis-soft:#1D2B62; --on-lapis:#0B1330;
    --ochre:#E6B54F; --ochre-soft:#3A2E14; --dot-on-done:#6A4300;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1330; --surface:#121C3F; --sunk:#1A2550; --ink:#E6E9F3; --muted:#9BA4C2; --line:#28335E;
  --lapis:#8AA4FF; --lapis-soft:#1D2B62; --on-lapis:#0B1330;
  --ochre:#E6B54F; --ochre-soft:#3A2E14; --dot-on-done:#6A4300;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px);padding-block:32px 96px;display:flex;flex-direction:column;gap:28px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px;border-radius:4px}
a{color:var(--lapis)}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* Hero */
.hero{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-data);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.3rem,7vw,3.5rem);line-height:1;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--lapis)}
.lede{margin:0;max-width:60ch;color:var(--muted);font-size:17px}

.timeline{display:flex;flex-direction:column;gap:6px}
.track{display:flex;align-items:flex-start;gap:3px;width:100%}
.seg{flex:1 1 0;min-width:0;container-type:inline-size;display:flex;flex-direction:column;gap:5px}
.brick{display:block;height:22px;border-radius:3px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;position:relative}
.brick i{position:absolute;inset:0 auto 0 0;background:var(--lapis);display:block}
.seg.full .brick{border-color:var(--lapis)}
.lab{font-family:var(--f-data);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:left}
@container (max-width: 30px){ .lab{visibility:hidden} }
.gap{flex:0 0 14px;height:22px;border-left:1px dashed var(--line);border-right:1px dashed var(--line);margin-inline:2px}
.ends{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:11px;color:var(--muted)}

.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0;padding:0;list-style:none}
.stats li{display:flex;flex-direction:column;gap:2px}
.stats .k{font-family:var(--f-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats .v{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.15}
.stats .v small{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted)}

/* Pace */
.pace{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pace .grp{display:flex;align-items:center;gap:10px}
.pace .lbl{font-size:14px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.stepper button{width:34px;height:34px;border:0;background:transparent;font-size:18px;line-height:1}
.stepper button:hover{background:var(--sunk)}
.stepper output{min-width:34px;text-align:center;font-family:var(--f-data);font-weight:500;font-variant-numeric:tabular-nums}
.pace select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px}
.pace .week{font-family:var(--f-data);font-size:13px;color:var(--muted);margin-left:auto}
.save{font-family:var(--f-data);font-size:12px;color:var(--muted);margin:-16px 0 0}
.save[data-s="error"]{color:var(--ochre)}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lapis)}
.panel{display:flex;flex-direction:column;gap:28px}

/* Today */
.today{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px}
.today .when{font-family:var(--f-data);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.today h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.1rem);line-height:1.1;margin:0;text-wrap:balance}
.today p{margin:0;max-width:62ch}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;min-width:0}
.chk input{width:18px;height:18px;accent-color:var(--lapis);margin:0;flex:none}
.chk span.t{min-width:0}
.chk.on{border-color:var(--lapis);background:var(--lapis-soft)}
.chk.on span.t{text-decoration:line-through;text-decoration-color:var(--muted)}
.kdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ochre);flex:none;margin-left:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--lapis);background:var(--lapis);color:var(--on-lapis);border-radius:8px;padding:9px 16px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--lapis)}
.link{font-weight:700;text-decoration:none}
.link:hover{text-decoration:underline}
.done-msg{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:8px;background:var(--ochre-soft)}

/* Upcoming */
.sub{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub h3,.sect{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0}
.sub .hint{font-size:14px;color:var(--muted);margin:0}
.days{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.day{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.day .d{font-family:var(--f-data);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .d b{display:block;color:var(--ink);font-weight:500}
.day.wk .d b{color:var(--ochre)}
.day .p{min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.day .p .n{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.day .a{display:flex;gap:12px;align-items:center;font-size:14px}
.day .a button{border:0;background:none;color:var(--lapis);font-weight:700;padding:4px 0}
.day .a button:hover,.day .a a:hover{text-decoration:underline}
.day .a a{text-decoration:none;font-weight:700}
.more{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700}
@media (max-width:560px){
  .day{grid-template-columns:1fr auto;grid-template-areas:"d a" "p p"}
  .day .d{grid-area:d}.day .p{grid-area:p}.day .a{grid-area:a}
  .day .d b{display:inline;margin-right:6px}
  .pace .week{margin-left:0}
}

/* Books */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--muted);margin:0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sect{display:flex;align-items:baseline;gap:10px}
.sect small{font-family:var(--f-data);font-size:12px;font-weight:400;color:var(--muted)}
.books{display:flex;flex-direction:column}
.book{display:flex;flex-direction:column;gap:10px;padding:20px 0;border-top:1px solid var(--line)}
.book.off .note,.book.off h3{opacity:.65}
.bh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.bh h3{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0}
.bh .meta{font-family:var(--f-data);font-size:12.5px;color:var(--muted)}
.bh .cnt{margin-left:auto;font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums}
.bh .cnt.full{color:var(--lapis);font-weight:500}
.tag{font-family:var(--f-data);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ochre);border:1px solid var(--ochre);border-radius:4px;padding:1px 6px}
.aside{font-family:var(--f-data);font-size:12px;color:var(--muted);margin:0}
.note{margin:0;max-width:66ch}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.chip{position:relative;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-data);font-size:14px;font-variant-numeric:tabular-nums;padding:0}
.chip:hover{border-color:var(--lapis)}
.chip[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.chip.k::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--ochre)}
.chip.k[aria-pressed="true"]::after{background:var(--dot-on-done)}
.chipdemo{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-data);font-size:12px;background:var(--surface);color:var(--ink)}
.chipdemo.on{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.bact{display:flex;flex-wrap:wrap;gap:10px}
.bact button{border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--lapis)}
.bact button:hover{border-color:var(--lapis)}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}
@media (prefers-reduced-motion:no-preference){
  .brick i{transition:width .35s ease}
  .chip,.chk{transition:background-color .15s,border-color .15s}
}
</style>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Apocalyptic reading plan · in the order written</p>
    <h1>Prophets to <em>Revelation</em></h1>
    <p class="lede">Every book is placed by when it was written, so you meet each image in Joel, Isaiah, Ezekiel, Daniel and Zechariah before Revelation uses it again.</p>
    <div class="timeline" id="timeline"></div>
    <ul class="stats" id="stats"></ul>
  </header>

  <section class="pace" id="pace" aria-label="Reading pace"></section>
  <p class="save" id="save" data-s="sync" role="status">Loading your progress…</p>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-plan" data-action="tab" data-tab="plan" aria-controls="plan">Plan</button>
    <button role="tab" id="tab-books" data-action="tab" data-tab="books" aria-controls="books">Books</button>
  </nav>

  <section class="panel" id="plan" role="tabpanel" aria-labelledby="tab-plan"></section>
  <section class="panel" id="books" role="tabpanel" aria-labelledby="tab-books" hidden></section>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toast-msg"></span><button type="button" data-action="undo">Undo</button></div>

<script>
(function(){
"use strict";

const BOOKS = [
  {id:"joel",name:"Joel",abbr:"Joel",bg:"Joel",ch:3,date:"c. 835 BC",t:"ot",key:[2,3],
   note:"The locust army and the sun and moon going dark. Revelation 9 and the sixth seal (6:12) pick up both, and Joel's harvest and winepress (3:13) return in Revelation 14."},
  {id:"amos",name:"Amos",abbr:"Amos",bg:"Amos",ch:9,date:"c. 760 BC",t:"ot",key:[5,9],
   note:"Amos turns the Day of the Lord into darkness for Israel too (5:18–20). He closes with David's fallen tent rebuilt (9:11), which James quotes at the Jerusalem council in Acts 15."},
  {id:"hosea",name:"Hosea",abbr:"Hos",bg:"Hosea",ch:14,date:"c. 755–715 BC",t:"ot",key:[3],optional:true,
   note:"Israel goes a long time without king or sacrifice, then returns to the Lord and to David their king in the latter days (3:4–5)."},
  {id:"isaiah",name:"Isaiah",abbr:"Isa",bg:"Isaiah",ch:66,date:"c. 740–680 BC",t:"ot",key:[2,6,11,13,24,25,26,27,34,63,65,66],
   note:"The seraphim's “Holy, holy, holy” (6) is sung again in Revelation 4. Chapters 24–27 are often called the little apocalypse. The sky rolling up like a scroll (34:4) returns at the sixth seal, and the one treading the winepress (63) is the rider of Revelation 19."},
  {id:"micah",name:"Micah",abbr:"Mic",bg:"Micah",ch:7,date:"c. 735–700 BC",t:"ot",key:[4,5],optional:true,
   note:"4:1–5 nearly repeats Isaiah 2, with the nations streaming to the Lord's mountain. 5:2 names Bethlehem as the birthplace of Israel's coming ruler."},
  {id:"zephaniah",name:"Zephaniah",abbr:"Zeph",bg:"Zephaniah",ch:3,date:"c. 630 BC",t:"ot",key:[1,3],
   note:"Chapter 1 is the Old Testament's fullest picture of the Day of the Lord as a day of wrath. Chapter 3 ends with Israel regathered and the Lord singing over them."},
  {id:"jeremiah",name:"Jeremiah",abbr:"Jer",bg:"Jeremiah",ch:52,date:"627–586 BC",t:"ot",key:[25,29,30,31,50,51],optional:true,
   note:"The time of Jacob's trouble (30:7) and the new covenant (31:31). Jeremiah's 70 years (25, 29) are what Daniel is reading when he prays in Daniel 9, and Babylon's fall (50–51) is the backdrop for Revelation 18."},
  {id:"ezekiel",name:"Ezekiel",abbr:"Ezek",bg:"Ezekiel",ch:48,date:"593–571 BC",t:"ot",key:[1,3,9,27,36,37,38,39,40,47,48],
   note:"The four living creatures (1), eating the scroll (3), the mark on foreheads (9), the merchants mourning Tyre (27), Gog and Magog (38–39), and the river flowing from the temple (47). Each one resurfaces in Revelation."},
  {id:"daniel",name:"Daniel",abbr:"Dan",bg:"Daniel",ch:12,date:"605–536 BC",t:"ot",key:[2,7,8,9,10,11,12],
   aside:"Placed after Ezekiel: Daniel's visions in chapters 7–12 come after Ezekiel's last prophecy.",
   note:"The statue (2) and the four beasts (7) trace the same kingdoms. The seventy weeks (9:24–27) are the backbone of the dispensational timeline, and chapter 12 brings in the time, times, and half a time, the 1,290 days, and the sealed book."},
  {id:"zechariah",name:"Zechariah",abbr:"Zech",bg:"Zechariah",ch:14,date:"c. 520 BC",t:"ot",key:[1,4,6,12,13,14],
   note:"The colored horses (1, 6) prefigure the four horsemen, and the two olive trees (4) become the two witnesses of Revelation 11. Chapters 12–14 show Israel mourning for the one they pierced and the Lord standing on the Mount of Olives."},
  {id:"malachi",name:"Malachi",abbr:"Mal",bg:"Malachi",ch:4,date:"c. 430 BC",t:"ot",key:[3,4],
   note:"The messenger who prepares the way, and the promise that Elijah comes before the great Day of the Lord (4:5). Many readers connect this to the two witnesses."},
  {id:"matthew",name:"Matthew",abbr:"Matt",bg:"Matthew",ch:28,date:"Spoken c. AD 33",t:"nt",key:[13,24,25],
   aside:"First in the New Testament: Jesus taught the Olivet Discourse before any epistle was written.",
   note:"The Olivet Discourse (24–25) brings in Daniel's abomination of desolation, the great tribulation, and the Son of Man coming on the clouds. Chapter 13's parables about the end of the age are worth flagging too."},
  {id:"1thess",name:"1 Thessalonians",abbr:"1 Th",bg:"1 Thessalonians",ch:5,date:"c. AD 50",t:"nt",key:[4,5],
   note:"4:13–18 is the central rapture passage. 5:1–11 connects it to the Day of the Lord coming like a thief."},
  {id:"2thess",name:"2 Thessalonians",abbr:"2 Th",bg:"2 Thessalonians",ch:3,date:"c. AD 51",t:"nt",key:[1,2],
   note:"The man of lawlessness who sets himself up in the temple (2) links Daniel's little horn to the beast of Revelation 13."},
  {id:"1cor",name:"1 Corinthians",abbr:"1 Co",bg:"1 Corinthians",ch:16,date:"c. AD 55",t:"nt",key:[15],
   note:"Chapter 15 lays out the order of the resurrection, the last trumpet, and death as the last enemy destroyed. Compare Revelation 20:14."},
  {id:"2peter",name:"2 Peter",abbr:"2 Pe",bg:"2 Peter",ch:3,date:"c. AD 65",t:"nt",key:[3],
   note:"Scoffers in the last days, a day as a thousand years, and the new heavens and new earth (3)."},
  {id:"revelation",name:"Revelation",abbr:"Rev",bg:"Revelation",ch:22,date:"c. AD 95",t:"nt",key:[],
   note:"By now most of its images should feel familiar. When one does, jot down where you first saw it."}
];

const ORDER = [];
BOOKS.forEach(b => {
  const ks = new Set(b.key);
  for (let i = 1; i <= b.ch; i++) ORDER.push({book:b, ch:i, key:b.id + "-" + i, isKey:ks.has(i)});
});
const BY_KEY = Object.fromEntries(ORDER.map(c => [c.key, c]));
const VERSIONS = ["NKJV","KJV","NASB","ESV","CSB","NIV","NLT"];
const MAX = {weekday:15, weekend:40};
const DEFAULTS = {done:{}, weekday:2, weekend:6, optional:{hosea:false, micah:false, jeremiah:false}, version:"NKJV"};
const LS = "prophets-to-revelation-v1";

const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (n, a, b) => Math.max(a, Math.min(b, Math.round(n)));
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

function normalize(raw){
  const s = clone(DEFAULTS);
  if (!raw || typeof raw !== "object") return s;
  if (raw.done && typeof raw.done === "object"){
    for (const [k, v] of Object.entries(raw.done)){
      if (BY_KEY[k] && typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) s.done[k] = v;
    }
  }
  if (Number.isFinite(raw.weekday)) s.weekday = clamp(raw.weekday, 0, MAX.weekday);
  if (Number.isFinite(raw.weekend)) s.weekend = clamp(raw.weekend, 0, MAX.weekend);
  if (raw.optional && typeof raw.optional === "object"){
    for (const k of Object.keys(s.optional)) s.optional[k] = !!raw.optional[k];
  }
  if (VERSIONS.includes(raw.version)) s.version = raw.version;
  return s;
}

function readLocal(){ try { const r = localStorage.getItem(LS); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function writeLocal(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){} }
function readTab(){ try { return localStorage.getItem(LS + "-tab"); } catch(e){ return null; } }
function writeTab(t){ try { localStorage.setItem(LS + "-tab", t); } catch(e){} }

let state = normalize(readLocal());
const ui = {tab: (location.hash === "#books" || location.hash === "#plan") ? location.hash.slice(1) : (readTab() === "books" ? "books" : "plan"), showAll:false};

/* ---------- dates ---------- */
function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function today(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function isWeekend(d){ const w = d.getDay(); return w === 0 || w === 6; }
function paceFor(d){ return isWeekend(d) ? state.weekend : state.weekday; }
const fmtDow = new Intl.DateTimeFormat(undefined, {weekday:"short"});
const fmtMD = new Intl.DateTimeFormat(undefined, {month:"short", day:"numeric"});
const fmtLong = new Intl.DateTimeFormat(undefined, {weekday:"long", month:"long", day:"numeric"});
function fmtFinish(d){
  const opts = {weekday:"short", month:"short", day:"numeric"};
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return new Intl.DateTimeFormat(undefined, opts).format(d);
}
function fmtReadOn(isoStr){
  const [y,m,dd] = isoStr.split("-").map(Number);
  return fmtMD.format(new Date(y, m-1, dd));
}

/* ---------- plan ---------- */
const included = b => !b.optional || state.optional[b.id];
const plan = () => ORDER.filter(c => included(c.book));

function schedule(){
  const t = today(), tIso = iso(t);
  const remaining = plan().filter(c => !state.done[c.key]);
  if (!remaining.length) return {days:[], remaining};
  if (state.weekday === 0 && state.weekend === 0) return {days:null, remaining};
  const readToday = Object.values(state.done).filter(v => v === tIso).length;
  const days = [];
  let i = 0, d = t, first = true, guard = 0;
  while (i < remaining.length && guard < 3000){
    let n = paceFor(d);
    if (first){ n = Math.max(0, n - readToday); first = false; }
    if (n > 0){ days.push({date:new Date(d), chapters:remaining.slice(i, i + n)}); i += n; }
    d = addDays(d, 1); guard++;
  }
  return {days, remaining};
}

function ranges(chs){
  const out = []; let cur = null;
  for (const c of chs){
    if (cur && cur.book === c.book && c.ch === cur.end + 1) cur.end = c.ch;
    else { if (cur) out.push(cur); cur = {book:c.book, start:c.ch, end:c.ch}; }
  }
  if (cur) out.push(cur);
  return out;
}
function passage(chs){
  const rs = ranges(chs); let s = "", prev = null;
  rs.forEach((r, i) => {
    const span = r.start === r.end ? String(r.start) : r.start + "–" + r.end;
    if (prev === r.book) s += ", " + span;
    else s += (i ? "; " : "") + r.book.name + " " + span;
    prev = r.book;
  });
  return s;
}
function bgUrl(chs){
  const q = ranges(chs).map(r => r.book.bg + " " + r.start + (r.end > r.start ? "-" + r.end : "")).join("; ");
  return "https://www.biblegateway.com/passage/?search=" + encodeURIComponent(q) + "&version=" + encodeURIComponent(state.version);
}
const readCount = b => { let n = 0; for (let i = 1; i <= b.ch; i++) if (state.done[b.id + "-" + i]) n++; return n; };

/* ---------- render ---------- */
const $ = id => document.getElementById(id);

function renderHero(sched){
  let segs = "", prevT = null; const aria = [];
  for (const b of BOOKS){
    if (!included(b)) continue;
    if (prevT === "ot" && b.t === "nt") segs += '<div class="gap" title="About 400 years pass between Malachi and Matthew"></div>';
    prevT = b.t;
    const r = readCount(b), p = (r / b.ch * 100).toFixed(1);
    aria.push(b.name + " " + r + " of " + b.ch);
    segs += '<div class="seg' + (r === b.ch ? " full" : "") + '" style="flex-grow:' + b.ch + '" title="' + esc(b.name + ": " + r + " of " + b.ch + " read") + '">' +
            '<span class="brick"><i style="width:' + p + '%"></i></span><span class="lab">' + esc(b.abbr) + '</span></div>';
  }
  $("timeline").innerHTML = '<div class="track" role="img" aria-label="' + esc("Progress by book: " + aria.join(", ")) + '">' + segs + '</div>' +
    '<div class="ends"><span>Joel · c. 835 BC</span><span>Revelation · c. AD 95</span></div>';

  const all = plan(), total = all.length, read = all.filter(c => state.done[c.key]).length;
  const pct = total ? Math.round(read / total * 100) : 0;
  let finish;
  if (!sched.remaining.length) finish = "Finished";
  else if (!sched.days) finish = "Set a pace";
  else finish = fmtFinish(sched.days[sched.days.length - 1].date);
  const keyLeft = sched.remaining.filter(c => c.isKey).length;
  $("stats").innerHTML =
    '<li><span class="k">Read</span><span class="v">' + read + ' <small>of ' + total + ' chapters · ' + pct + '%</small></span></li>' +
    '<li><span class="k">Finish at this pace</span><span class="v">' + esc(finish) + '</span></li>' +
    '<li><span class="k">Revelation-linked left</span><span class="v">' + keyLeft + ' <small>chapters</small></span></li>';
}

function renderPace(){
  const perWeek = state.weekday * 5 + state.weekend * 2;
  const opts = VERSIONS.map(v => '<option' + (v === state.version ? " selected" : "") + '>' + v + '</option>').join("");
  $("pace").innerHTML =
    '<div class="grp"><span class="lbl" id="l-wd">Mon–Fri</span><span class="stepper" role="group" aria-labelledby="l-wd">' +
      '<button type="button" id="wd-minus" data-action="pace" data-field="weekday" data-d="-1" aria-label="Fewer weekday chapters">−</button>' +
      '<output aria-live="polite">' + state.weekday + '</output>' +
      '<button type="button" id="wd-plus" data-action="pace" data-field="weekday" data-d="1" aria-label="More weekday chapters">+</button></span>' +
      '<span class="lbl">ch/day</span></div>' +
    '<div class="grp"><span class="lbl" id="l-we">Sat &amp; Sun</span><span class="stepper" role="group" aria-labelledby="l-we">' +
      '<button type="button" id="we-minus" data-action="pace" data-field="weekend" data-d="-1" aria-label="Fewer weekend chapters">−</button>' +
      '<output aria-live="polite">' + state.weekend + '</output>' +
      '<button type="button" id="we-plus" data-action="pace" data-field="weekend" data-d="1" aria-label="More weekend chapters">+</button></span>' +
      '<span class="lbl">ch/day</span></div>' +
    '<div class="grp"><label class="lbl" for="version">Bible</label><select id="version">' + opts + '</select></div>' +
    '<span class="week">' + perWeek + ' chapters a week</span>';
}

function chkList(chs, tIso){
  return '<div class="chks">' + chs.map(c => {
    const on = !!state.done[c.key];
    return '<label class="chk' + (on ? " on" : "") + '" for="t-' + c.key + '"><input type="checkbox" id="t-' + c.key + '" data-key="' + c.key + '"' + (on ? " checked" : "") + '>' +
      '<span class="t">' + esc(c.book.name + " " + c.ch) + '</span>' + (c.isKey ? '<span class="kdot" title="Revelation draws on this chapter"></span>' : '') + '</label>';
  }).join("") + '</div>';
}

function renderPlan(sched){
  const t = today(), tIso = iso(t);
  let html = "";
  if (!sched.remaining.length){
    html += '<div class="today"><p class="when">' + esc(fmtLong.format(t)) + '</p><h2>You finished the plan</h2>' +
      '<p>Every chapter from Joel to Revelation is checked off. Revelation should read very differently now that you know where its images come from.</p></div>';
    $("plan").innerHTML = html; return;
  }
  if (!sched.days){
    html += '<div class="today"><p class="when">' + esc(fmtLong.format(t)) + '</p><h2>Set a pace to build your schedule</h2>' +
      '<p>Use the Mon–Fri and Sat &amp; Sun controls above. You can still check off chapters on the Books tab.</p></div>';
    $("plan").innerHTML = html; return;
  }
  const first = sched.days[0];
  const assigned = first && iso(first.date) === tIso ? first.chapters : [];
  const aset = new Set(assigned.map(c => c.key));
  const list = ORDER.filter(c => state.done[c.key] === tIso || aset.has(c.key));
  const upcoming = sched.days.filter(d => iso(d.date) !== tIso);
  const unread = list.filter(c => !state.done[c.key]);

  html += '<div class="today"><p class="when">Today · ' + esc(fmtLong.format(t)) + '</p>';
  if (list.length){
    html += '<h2>' + esc(passage(list)) + '</h2>' + chkList(list, tIso);
    if (unread.length){
      html += '<div class="row"><button type="button" class="btn" id="mark-today" data-action="mark" data-keys="' + unread.map(c => c.key).join(",") + '">Mark all read</button>' +
        '<a class="link" href="' + esc(bgUrl(unread)) + '" target="_blank" rel="noopener">Read in ' + esc(state.version) + ' ↗</a></div>';
    }
  } else {
    html += '<h2>No reading planned today</h2>';
  }
  if (!unread.length && upcoming.length){
    const nx = upcoming[0];
    const lead = list.length ? "Today's reading is done." : "Your pace has today off.";
    html += '<div class="done-msg"><strong>' + lead + '</strong><span>Next up ' + esc(fmtDow.format(nx.date) + ", " + fmtMD.format(nx.date)) + ': ' + esc(passage(nx.chapters)) + '.</span>' +
      '<div class="row"><button type="button" class="btn ghost" id="read-ahead" data-action="mark" data-keys="' + nx.chapters.map(c => c.key).join(",") + '">Mark next reading done</button>' +
      '<a class="link" href="' + esc(bgUrl(nx.chapters)) + '" target="_blank" rel="noopener">Read ahead in ' + esc(state.version) + ' ↗</a></div></div>';
  }
  html += '</div>';

  if (upcoming.length){
    const show = ui.showAll ? upcoming : upcoming.slice(0, 14);
    const tomorrow = iso(addDays(t, 1));
    html += '<div class="sub"><h3>Coming up</h3><p class="hint">Reading ahead or falling behind re-flows the whole schedule.</p></div>';
    html += '<ul class="days">' + show.map(d => {
      const di = iso(d.date), wk = isWeekend(d.date);
      const label = di === tomorrow ? "Tomorrow" : fmtDow.format(d.date);
      const keyN = d.chapters.filter(c => c.isKey).length;
      return '<li class="day' + (wk ? " wk" : "") + '"><div class="d"><b>' + esc(label) + '</b>' + esc(fmtMD.format(d.date)) + '</div>' +
        '<div class="p"><span>' + esc(passage(d.chapters)) + '</span><span class="n">' + d.chapters.length + ' ch' + (keyN ? ' · ' + keyN + ' linked' : '') + '</span></div>' +
        '<div class="a"><a href="' + esc(bgUrl(d.chapters)) + '" target="_blank" rel="noopener">Read ↗</a>' +
        '<button type="button" id="m-' + di + '" data-action="mark" data-keys="' + d.chapters.map(c => c.key).join(",") + '">Mark read</button></div></li>';
    }).join("") + '</ul>';
    if (upcoming.length > 14){
      html += '<button type="button" class="more" id="showall" data-action="showall">' + (ui.showAll ? "Show the next two weeks only" : "Show the full schedule (" + upcoming.length + " reading days)") + '</button>';
    }
  }
  $("plan").innerHTML = html;
}

function renderBooks(){
  let html = '<p class="legend"><span><span class="chipdemo">1</span> unread</span><span><span class="chipdemo on">1</span> read</span>' +
    '<span><span class="kdot" style="margin:0"></span> Revelation draws on this chapter</span><span>Tap a chapter to check it off.</span></p>';
  for (const sec of [["ot","Old Testament"],["nt","New Testament"]]){
    const bs = BOOKS.filter(b => b.t === sec[0]);
    const inc = bs.filter(included), tot = inc.reduce((a, b) => a + b.ch, 0), rd = inc.reduce((a, b) => a + readCount(b), 0);
    html += '<h2 class="sect">' + sec[1] + ' <small>' + rd + ' / ' + tot + '</small></h2><div class="books">';
    for (const b of bs){
      const on = included(b), r = readCount(b);
      html += '<article class="book' + (on ? "" : " off") + '"><div class="bh"><h3>' + esc(b.name) + '</h3>' +
        '<span class="meta">' + esc(b.date) + ' · ' + b.ch + ' chapters</span>' + (b.optional ? '<span class="tag">Optional</span>' : '') +
        (on ? '<span class="cnt' + (r === b.ch ? " full" : "") + '">' + r + ' / ' + b.ch + '</span>' : '') + '</div>';
      if (b.aside) html += '<p class="aside">' + esc(b.aside) + '</p>';
      html += '<p class="note">' + esc(b.note) + '</p>';
      if (on){
        html += '<div class="chips">';
        for (let i = 1; i <= b.ch; i++){
          const k = b.id + "-" + i, d = state.done[k], isK = b.key.includes(i);
          html += '<button type="button" class="chip' + (isK ? " k" : "") + '" id="c-' + k + '" data-action="toggle" data-key="' + k + '" aria-pressed="' + (d ? "true" : "false") + '"' +
            ' aria-label="' + esc(b.name + " " + i + (d ? ", read " + fmtReadOn(d) : ", unread") + (isK ? ", linked to Revelation" : "")) + '"' +
            ' title="' + esc(d ? "Read " + fmtReadOn(d) : b.name + " " + i) + '">' + i + '</button>';
        }
        html += '</div><div class="bact">';
        if (r < b.ch) html += '<button type="button" id="mb-' + b.id + '" data-action="markbook" data-book="' + b.id + '">Mark all of ' + esc(b.name) + ' read</button>';
        if (b.optional) html += '<button type="button" id="ob-' + b.id + '" data-action="opt" data-book="' + b.id + '">Remove from plan</button>';
        html += '</div>';
      } else {
        html += '<div class="bact"><button type="button" id="ob-' + b.id + '" data-action="opt" data-book="' + b.id + '">Add to plan (+' + b.ch + ' chapters)</button></div>';
      }
      html += '</article>';
    }
    html += '</div>';
  }
  $("books").innerHTML = html;
}

function renderTabs(){
  for (const t of ["plan","books"]){
    $("tab-" + t).setAttribute("aria-selected", ui.tab === t ? "true" : "false");
    $("tab-" + t).tabIndex = ui.tab === t ? 0 : -1;
    $(t).hidden = ui.tab !== t;
  }
}

function render(){
  const focusId = document.activeElement && document.activeElement.id;
  const sched = schedule();
  renderHero(sched); renderPace(); renderTabs();
  if (ui.tab === "plan") renderPlan(sched); else renderBooks();
  if (focusId){ const el = $(focusId); if (el && el !== document.activeElement) el.focus({preventScroll:true}); }
}

/* ---------- saving ---------- */
let docRef = null, mode = "local", saving = false, dirty = false, timer = null, retried = false;
function setStatus(s){
  const el = $("save"); el.dataset.s = s;
  el.textContent = {
    sync:"Loading your progress…",
    saving:"Saving…",
    saved:"Progress saved to your Claude account",
    local:"Progress saves in this browser only",
    error:"Couldn't reach your account. Changes are kept in this browser for now."
  }[s] || "";
}
function persist(){
  writeLocal();
  dirty = true;
  if (!docRef){ dirty = false; setStatus("local"); return; }
  setStatus("saving");
  clearTimeout(timer);
  timer = setTimeout(() => { timer = null; flush(); }, 450);
}
async function flush(){
  if (saving || !dirty) return;
  if (!docRef){ dirty = false; setStatus("local"); return; }
  saving = true; dirty = false;
  let retry = false;
  try {
    await docRef.set({v:1, done:state.done, weekday:state.weekday, weekend:state.weekend, optional:state.optional, version:state.version});
    retried = false;
    if (!dirty) setStatus("saved");
  } catch(e){
    const code = e && e.code;
    if (code === "unavailable" && !retried){ retried = true; dirty = true; retry = true; }
    else if (code === "invalid_argument" || code === "not_granted" || code === "revoked" || code === "capability_disabled" || code === "capability_removed"){
      docRef = null; mode = "local"; setStatus("local");
    } else { setStatus("error"); retried = false; }
  }
  saving = false;
  if (retry) setTimeout(flush, 1000 + Math.random() * 1500);
  else if (dirty) flush();
}

function adoptRemote(data){
  state = normalize(data);
  writeLocal();
  render();
}

(async function connect(){
  const c = window.claude;
  if (!c || typeof c.use !== "function"){ setStatus("local"); return; }
  try {
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user){ setStatus("local"); return; }
    const uid = await user.id();
    if (!uid){ setStatus("local"); return; }
    docRef = db.doc("data/users/" + uid + "/plan");
    mode = "db";
    let firstSnap = true;
    docRef.onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (dirty || saving || timer) return;
      if (!snap.exists){
        if (firstSnap){
          firstSnap = false;
          const hasLocal = Object.keys(state.done).length > 0 || state.weekday !== DEFAULTS.weekday || state.weekend !== DEFAULTS.weekend;
          if (hasLocal) persist(); else setStatus("saved");
        }
        return;
      }
      firstSnap = false;
      setStatus("saved");
      adoptRemote(snap.data());
    }, err => {
      docRef = null; mode = "local";
      setStatus(err && err.code === "revoked" ? "local" : "error");
    });
  } catch(e){ docRef = null; setStatus("local"); }
})();

/* ---------- actions ---------- */
let undoSnap = null, toastTimer = null;
function toast(msg, snap){
  undoSnap = snap;
  $("toast-msg").textContent = msg;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; undoSnap = null; }, 7000);
}
function markKeys(keys){
  const snap = clone(state.done), tIso = iso(today());
  let n = 0;
  for (const k of keys) if (BY_KEY[k] && !state.done[k]){ state.done[k] = tIso; n++; }
  if (!n) return;
  persist(); render();
  toast("Marked " + n + (n === 1 ? " chapter" : " chapters") + " read", snap);
}
function toggleKey(k){
  if (!BY_KEY[k]) return;
  if (state.done[k]) delete state.done[k]; else state.done[k] = iso(today());
  persist(); render();
}

document.addEventListener("click", e => {
  const el = e.target.closest("button[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "tab"){
    ui.tab = el.dataset.tab; writeTab(ui.tab);
    try { history.replaceState(null, "", "#" + ui.tab); } catch(_){}
    render();
  } else if (a === "toggle") toggleKey(el.dataset.key);
  else if (a === "mark") markKeys(el.dataset.keys.split(","));
  else if (a === "markbook"){
    const b = BOOKS.find(x => x.id === el.dataset.book); if (!b) return;
    const ks = []; for (let i = 1; i <= b.ch; i++) ks.push(b.id + "-" + i);
    markKeys(ks);
  } else if (a === "pace"){
    const f = el.dataset.field, d = Number(el.dataset.d);
    const nv = clamp(state[f] + d, 0, MAX[f]);
    if (nv !== state[f]){ state[f] = nv; persist(); render(); }
  } else if (a === "opt"){
    const id = el.dataset.book; state.optional[id] = !state.optional[id];
    persist(); render();
  } else if (a === "showall"){ ui.showAll = !ui.showAll; render(); }
  else if (a === "undo"){
    if (undoSnap){ state.done = undoSnap; undoSnap = null; persist(); render(); }
    $("toast").hidden = true;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.matches('input[type="checkbox"][data-key]')) toggleKey(el.dataset.key);
  else if (el.id === "version" && VERSIONS.includes(el.value)){ state.version = el.value; persist(); render(); }
});
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  ui.tab = ui.tab === "plan" ? "books" : "plan"; writeTab(ui.tab); render(); $("tab-" + ui.tab).focus();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

render();
setStatus(window.claude && typeof window.claude.use === "function" ? "sync" : "local");
})();
</script>
